                <fca-text-100554 style="width:100%" text="ESPANHOL É A LÍNGUA DO FUTURO!" styleel="text-align:center"
                        widget="h2" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
</fca-row-100554> 
<fca-row-100554 renderType="edit" widget="div" level="4">
        <fca-col-100554 renderType="edit" widget="div" level="4">
                <fca-text-100554
                        text='Pesquisas mostram que brasileiros que falam o espanhol podem <span style="color: #ffcc00;">ganhar até 34% a mais.</span> Além disso, o espanhol vem ganhando importância e é a <span style="color: #ffcc00;">língua ideal</span> para quem quer quer viajar, morar ou estudar em outros países.'
                        styleel="font-weight: 500;" widget="p" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
</fca-row-100554>
<fca-row-100554 renderType="edit" widget="div" level="4">
        <fca-col-100554 renderType="edit" widget="div" level="4">
                <fca-text-100554
                        text='<span style="color: #ffcc00;">E para quem é a JORNADA? </span> Focado em jovens e adultos que querem <span style="color: #ffcc00;">abandonar o portunhol,</span> este minicurso gratuito e ao vivo é fundamental para...'
                        styleel="font-weight: 500;" widget="p" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
</fca-row-100554>
<fca-row-100554 renderType="edit" widget="div" level="4">
        <fca-col-100554 renderType="edit" widget="div" level="4">
                <fca-text-100554 text="...para você que quer aprender espanhol para viajar para outros países!"
                        styleel="text-align:center;font-weight: 500;" widget="p" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
        <fca-col-100554 renderType="edit" widget="div" level="4">
                <fca-text-100554 text="...para você que precisa aprender espanhol para crescer na carreira!"
                        styleel="text-align:center;font-weight: 500;" widget="p" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
        <fca-col-100554 renderType="edit" widget="div" level="4">
                <fca-text-100554 text="...para você que precisa de espanhol para estudar fora, graduação ou pós!"
                        styleel="text-align:center;font-weight: 500;" widget="p" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
        <fca-col-100554 renderType="edit" widget="div" level="4">
                <fca-text-100554 text="...para você que sempre quis aprender mais nunca teve a oportunidade!"
                        styleel="text-align:center;font-weight: 500;" widget="p" renderType="edit" level="4">
                </fca-text-100554>
        </fca-col-100554>
</fca-row-100554>
