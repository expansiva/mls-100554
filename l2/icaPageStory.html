		<wc-text-100554
			id="apText111111"
			text="I remember very clearly that till a few months ago, Prompt Engineering was all the hype. The entire job market was filled with the role of prompt engineers, but not so anymore. Prompt engineering was not any art or science, it was just a clever Hans phenomenon, hmans putting up the necessary context for the system to answer in a better way. People even wrote <b>books/blogs</b> like the Top 50 prompts to get the best of GPT, so on and so forth. But large-scale experiments have clearly shown that there is no single prompt or strategy that works for all kinds of problems, its just some prompts appear to be better in isolation but are a hit-and-miss when analyzed comprehensively.dasdasd<br>"
			type="p"
			text-es="Edad:"
			class="story-desc">
		</wc-text-100554>

			id="image1"
			src="https://miro.medium.com/v2/resize:fit:700/0*GJUZGzVAqP6Kd6yX">
		</widget-image-100554>
		<wc-text-100554
			id="apText2"
			text="So, today we are going to talk about DSPY: COMPILING DECLARATIVE LANGUAGE MODEL CALLS INTO SELF-IMPROVING PIPELINES, a framework developed by Stanford for self-improvement pipelines, where LLMs are treated as a module that is being optimized by a compiler, similar to the abstractions found in PyTorch."
