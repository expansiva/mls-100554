<page-test4-100554
	modeoverlay='wcd-overlay-mode-default-100554'>
	<widget-section-100554
		id='section1'
		class='full'>
		<widget-default-text-100554
			id='apText1'
			text='Relatório de Pedidos e Status'
			type='h2'>
		</widget-default-text-100554>
		<widget-divider-line-100554
			id='apDivider1'>
		</widget-divider-line-100554>
		<widget-row-100554
			id='test'>
			<widget-column-100554
				id='c1'>
				<widget-input-text-100554
					label='Nome do solicitante'
					value='{{ projectTest.page4.filter.solicitante }}'
					id='t1'>
				</widget-input-text-100554>
			</widget-column-100554>
			<widget-column-100554
				id='c2'>
				<widget-select-one-autocomplete-material-100554
					label='Status'
					selectedvalue='{{projectTest.page4.filter.status}}'
					options='{{projectTest.page4.status}}'
					
				>
				</widget-select-one-autocomplete-material-100554>
			</widget-column-100554>
			<widget-column-100554
				id='c5'>
				<widget-button-submit-100554
					id='btnFilter'
					clicked-action='{{ projectTest.page4.action }}'
					clicked-value='filter'
					text='Filtrar'>
				</widget-button-submit-100554>
			</widget-column-100554>
		</widget-row-100554>
		<widget-divider-line-100554
			id='apDivider1'>
		</widget-divider-line-100554>
		<widget-table-select-100554
			data='{{ projectTest.page4.actualData }}'
			columns='{{ projectTest.page4.fields }}'
			id='tableSelect'
			data-event='item-selected'>
		</widget-table-select-100554>
	</widget-section-100554>
</page-test4-100554>
