<page-test2-100554
	modeoverlay="wcd-overlay-mode-default-100554s">
	<widget-section-100554
		id="section1"
		class="inset"> 
		<widget-default-text-100554
			id="apText1"
			text="Fornecedores"
			text-en="Suppliers"
			type="h2"
			class="story-title">
		</widget-default-text-100554>
		<widget-table-select-100554
			data="{{projectTest.tables.fornecedores}}"
			columns="{{projectTest.page2.columns}}"
			id="tableSelect"
			selected="{{projectTest.page2.indexSel}}">
		</widget-table-select-100554>
		<widget-form-100554
			id="contentForm">
			<widget-input-text-100554
				label="Nome empresa"
				id="iptNome"
				value="{{projectTest.page2.selecionado.empresa}}">
			</widget-input-text-100554>
			<widget-input-text-100554
				label="CNPJ"
				id="iptCnpj"
				value="{{projectTest.page2.selecionado.cnpj}}">
			</widget-input-text-100554>
			<widget-input-text-100554
				label="Endereço"
				id="iptEnd"
				value="{{projectTest.page2.selecionado.endereco}}">
			</widget-input-text-100554>
			<widget-input-text-100554
				label="Contato"
				id="iptCont"
				value="{{projectTest.page2.selecionado.contato}}">
			</widget-input-text-100554>
			<widget-row-100554
				id="widget1">
					<widget-input-text-100554
						label="Produtos fornecidos"
						id="iptProd"
						value="{{projectTest.page2.selecionado.produtos}}">
					</widget-input-text-100554>
					<widget-default-text-100554
						type="p"
						text=""
						id="apText2">
					</widget-default-text-100554>
			</widget-row-100554>
		</widget-form-100554>
		<widget-divider-100554
			id="apDivider1">
		</widget-divider-100554>
		<widget-row-100554
			widget="widget-row-100554">
			<widget-button-submit-100554
				id="buttonNovo"
				text="Novo"
				clicked-value="newRow"
				clicked-action="{{projectTest.page2.action}}">
			</widget-button-submit-100554>
			<widget-button-submit-100554
				id="buttonSalvar"
				text="Salvar"
				clicked-value="save"
				clicked-action="{{projectTest.page2.action}}">
			</widget-button-submit-100554>
			<widget-button-submit-100554
				id="buttonCancelar"
				text="Cancelar"
				clicked-value="cancel"
				clicked-action="{{projectTest.page2.action}}">
			</widget-button-submit-100554>
			<widget-button-submit-100554
				id="buttonExcluir"
				text="Excluir"
				clicked-value="del"
				clicked-action="{{projectTest.page2.action}}">
			</widget-button-submit-100554>
		</widget-row-100554>
		<widget-default-text-100554
			type="p"
			text="{{projectTest.page2.labelError}}"
			id="labelError">
		</widget-default-text-100554>
		<widget-default-text-100554
			type="p"
			text="{{projectTest.page2.labelOk}}"
			id="labelOk">
		</widget-default-text-100554>
	</widget-section-100554>
</page-test2-100554>
