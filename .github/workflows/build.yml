name: Build TypeScript

on:
  push:
    branches:
      - main  # ou a branch que você deseja monitorar
  pull_request:
    branches:
      - main  # ou a branch que você deseja monitorar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14'  # ou a versão do Node.js que você está usando

    - name: Install dependencies
      run: npm install

    - name: Compile CI
      run: npm run buildCI
      env:
          COLLAB_PROJECT: 100554
          COLLAB_REPO: "mls-100554"
          COLLAB_OWNER: "expansiva"
          COLLAB_BRANCH: "main"
          COLLAB_DRIVER: "GitHub"
          COLLAB_TOKEN: ${{ vars.COLLAB_TOKEN }}
          
    - name: Commit compiled files
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add obj
        git commit -m "Compile TypeScript files"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Push changes
      run: git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
